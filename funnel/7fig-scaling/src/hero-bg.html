<!doctype html>
<!-- Hero background: navy night sky, crimson glow, silver stars, Chicago-style skyline. Render: src/render-hero-bg.sh -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#081428 0%,#0F2240 45%,#162E52 72%,#2A1530 100%)}
.l{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
</style></head><body>
<div class="glow" style="left:58%;top:52%;width:1300px;height:560px;margin-left:-650px;background:rgba(194,29,43,.55)"></div>
<div class="glow" style="left:-300px;top:-200px;width:900px;height:700px;background:rgba(40,80,150,.35)"></div>
<div class="glow" style="right:-260px;top:-160px;width:820px;height:640px;background:rgba(194,29,43,.25)"></div>
<svg class="l" id="sky" width="100%" height="100%"></svg>
<svg class="l" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172C50"/><stop offset="1" stop-color="#0F2040"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1D38"/><stop offset="1" stop-color="#070F1E"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EF4B55" stop-opacity=".9"/><stop offset="1" stop-color="#EF4B55" stop-opacity="0"/></linearGradient>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="4" height="6" fill="#F5D9A8" opacity=".35"/></pattern>
  </defs>
  <g id="farline" fill="url(#far)"></g>
  <g id="nearline" fill="url(#near)"></g>
  <rect y="1040" width="1920" height="40" fill="#060C18"/>
</svg>
<script>
let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const W = innerWidth, H = innerHeight, ns = 'http://www.w3.org/2000/svg';
const sky = document.getElementById('sky');
for (let i = 0; i < 260; i++) { // silver stars, denser at the top
  const c = document.createElementNS(ns, 'circle'), y = Math.pow(r(), 1.8) * H * .62;
  c.setAttribute('cx', r() * W); c.setAttribute('cy', y); c.setAttribute('r', (r() * 1.4 + .3).toFixed(2));
  c.setAttribute('fill', r() < .12 ? '#EF4B55' : '#E8EAEE'); c.setAttribute('opacity', (.25 + r() * .6).toFixed(2)); sky.appendChild(c);
}
for (const [x, y, s] of [[.12, .14, 9], [.88, .1, 7], [.7, .26, 5], [.3, .08, 6]]) { // a few 4-point sparkles
  const p = document.createElementNS(ns, 'path'), cx = x * W, cy = y * H;
  p.setAttribute('d', `M${cx} ${cy - s * 2}L${cx + s * .35} ${cy - s * .35}L${cx + s * 2} ${cy}L${cx + s * .35} ${cy + s * .35}L${cx} ${cy + s * 2}L${cx - s * .35} ${cy + s * .35}L${cx - s * 2} ${cy}L${cx - s * .35} ${cy - s * .35}Z`);
  p.setAttribute('fill', '#E8EAEE'); p.setAttribute('opacity', '.7'); sky.appendChild(p);
}
// Skyline: buildings as [x, width, height, top style]. Willis-style stepped tower with twin antennas, Hancock-style tapered tower.
const tower = (g, x, w, h, top, win) => {
  const base = 1040, y = base - h;
  const add = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; };
  if (top === 'willis') {
    add('rect', { x, y: y + 120, width: w, height: h - 120 }); add('rect', { x: x + w * .15, y: y + 50, width: w * .7, height: 80 });
    add('rect', { x: x + w * .3, y, width: w * .4, height: 60 });
    add('rect', { x: x + w * .36, y: y - 90, width: 4, height: 92 }); add('rect', { x: x + w * .6, y: y - 80, width: 4, height: 82 });
  } else if (top === 'hancock') {
    add('path', { d: `M${x} ${base}L${x + w * .12} ${y}L${x + w * .88} ${y}L${x + w} ${base}Z` });
    add('rect', { x: x + w * .3, y: y - 70, width: 3, height: 72 }); add('rect', { x: x + w * .62, y: y - 60, width: 3, height: 62 });
  } else if (top === 'spire') {
    add('rect', { x, y, width: w, height: h }); add('path', { d: `M${x + w * .2} ${y}L${x + w / 2} ${y - 70}L${x + w * .8} ${y}Z` });
  } else if (top === 'step') {
    add('rect', { x, y: y + 30, width: w, height: h - 30 }); add('rect', { x: x + w * .2, y, width: w * .6, height: 34 });
  } else add('rect', { x, y, width: w, height: h });
  if (win) add('rect', { x: x + 4, y: y + 130, width: w - 8, height: h - 140, fill: 'url(#win)' });
};
const far = document.getElementById('farline'), near = document.getElementById('nearline');
let x = -20; while (x < 1940) { const w = 50 + r() * 70, h = 120 + r() * 200; tower(far, x, w, h, r() < .3 ? 'step' : 'flat', false); x += w + r() * 10; }
const nearB = [[60,110,330,'flat'],[180,80,420,'step'],[270,95,280,'flat'],[1230,150,780,'willis'],[1400,90,460,'step'],[1500,120,600,'hancock'],[1630,70,340,'flat'],[1710,100,500,'spire'],[1820,120,300,'flat'],[1100,110,380,'flat'],[380,70,250,'flat'],[980,100,300,'step']];
for (const [bx, w, h, t] of nearB) tower(near, bx, w, h * .78, t, true);
// crimson rim light along the near skyline tops
near.setAttribute('filter', 'drop-shadow(0 -2px 6px rgba(239,75,85,.55))');
</script>
</body></html>

<!-- Goat's 33 THANK-YOU · 01 TOP BAR · own GHL section, padding 0, no background
     Also loads the fonts and the scroll fade-in used by the whole page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap">
<div class="wf wf-top">
  <div class="wf-top__in">
    <span><span class="wf-top__dot" aria-hidden="true"></span>You're in · Doors open Oct 19</span>
    <a href="#wf-calendar">Add to calendar →</a>
  </div>
</div>
<script>
/* Fades sections in as they scroll into view. Only elements this script reaches are hidden first,
   so if it doesn't run (or GHL adds blocks later), everything simply shows. */
(function () {
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function arm() {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); e.target.classList.add('is-in'); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('[data-reveal]:not([data-reveal="armed"])').forEach(function (el) {
      if (el.getBoundingClientRect().top < innerHeight) return; // already on screen: leave it visible
      el.setAttribute('data-reveal', 'armed'); io.observe(el);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
  window.addEventListener('load', arm);
})();
</script>
